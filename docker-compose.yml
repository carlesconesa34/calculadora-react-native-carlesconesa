services:
  web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
    environment:
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true
    command: npm run web -- --host lan

volumes:
  node_modules: